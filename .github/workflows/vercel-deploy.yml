# Deploys this repo to Vercel on every push to main (production) and every
# pull request (preview).
#
# Required repository secrets
# (Settings -> Secrets and variables -> Actions -> New repository secret):
#
#   VERCEL_TOKEN       Account token: https://vercel.com/account/tokens
#   VERCEL_ORG_ID      From `vercel link` -> .vercel/project.json ("orgId"),
#                      or Vercel dashboard -> Settings -> General -> Team ID
#   VERCEL_PROJECT_ID  From `vercel link` -> .vercel/project.json ("projectId"),
#                      or Project -> Settings -> General -> Project ID
#
# NOTE: vercel.json currently 308-redirects every path to
# https://www.the8dengine.com/ — the app itself is served from Railway
# (see railway.toml). This pipeline therefore deploys the canonical-domain
# redirect shim, not the 8D engine itself.

name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One deploy at a time per ref; supersede in-flight runs.
concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork PRs cannot read secrets; skip rather than fail confusingly.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Verify Vercel secrets are configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=("VERCEL_TOKEN")
          [ -n "$VERCEL_ORG_ID" ] || missing+=("VERCEL_ORG_ID")
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=("VERCEL_PROJECT_ID")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}. Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # push to main / manual run on main -> production; everything else -> preview.
      - name: Select deploy target
        id: target
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=${{ steps.target.outputs.environment }} --token="$VERCEL_TOKEN"

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy ${{ steps.target.outputs.prod_flag }} --token="$VERCEL_TOKEN")
          echo "Deployed ${{ steps.target.outputs.environment }}: $url"
          echo "### Vercel ${{ steps.target.outputs.environment }} deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
